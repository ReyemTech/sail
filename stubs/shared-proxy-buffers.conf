# Raised proxy header buffers for the shared LAN proxy.
#
# nginx's default proxy_buffer_size (4k/8k) is too small for large upstream
# RESPONSE headers — a long Content-Security-Policy, many Set-Cookie, etc. —
# which makes nginx return "502 Bad Gateway" with "upstream sent too big header"
# even though the app rendered fine. This raises the header buffers so those
# responses pass through. Mirrors the per-project nginx FastCGI buffer bump,
# applied to the shared proxy layer. Loaded first (00-) from /etc/nginx/conf.d.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
