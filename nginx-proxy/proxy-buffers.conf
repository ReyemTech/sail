# Raise upstream header buffers on the reverse proxy.
#
# The default proxy_buffer_size (4k) is too small to hold large response headers
# from the app — a sizable Content-Security-Policy plus session/XSRF cookies and
# dev-tool headers (e.g. Clockwork) can exceed it. When that happens nginx-proxy
# returns "502 upstream sent too big header" on pages the app served as 200.
#
# These directives are http-context (included via /etc/nginx/conf.d/*.conf) and
# apply to every proxied vhost.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
